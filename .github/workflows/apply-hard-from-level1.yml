name: Apply Hard From Level 1

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make level 1 hard
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/screens/arrow_game_screen.dart')
          s = p.read_text()
          old = "int get _difficulty => widget.level <= 5 ? 2 : min(10, 6 + ((widget.level - 6) ~/ 100));"
          new = "int get _difficulty => min(10, 6 + ((widget.level - 1) ~/ 10));"
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)

          w = Path('.github/workflows/apply-hard-from-level1.yml')
          if w.exists():
              w.unlink()

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/arrow_game_screen.dart .github/workflows/apply-hard-from-level1.yml
          git diff --cached --quiet || git commit -m "Make level 1 hard and scale difficulty"
          git push