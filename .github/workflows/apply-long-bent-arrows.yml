name: Apply Long Bent Arrows

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply long bent arrow board') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Replace board painter
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/screens/arrow_game_screen.dart')
          text = path.read_text()
          marker = 'class _ArrowBoardPainter extends CustomPainter {'
          start = text.index(marker)
          replacement = r'''class _ArrowBoardPainter extends CustomPainter {
  _ArrowBoardPainter({
    required this.puzzle,
    required this.cleared,
    required this.hints,
    required this.wrongPoint,
    required this.wrongProgress,
    required this.clearingPoint,
    required this.clearProgress,
  });

  final ArrowPuzzle puzzle;
  final Set<GridPoint> cleared;
  final Set<GridPoint> hints;
  final GridPoint? wrongPoint;
  final double wrongProgress;
  final GridPoint? clearingPoint;
  final double clearProgress;

  Offset _center(GridPoint point, double cellWidth, double cellHeight) =>
      Offset(
        point.col * cellWidth + cellWidth / 2,
        point.row * cellHeight + cellHeight / 2,
      );

  @override
  void paint(Canvas canvas, Size size) {
    if (puzzle.rows <= 0 || puzzle.columns <= 0) return;

    final cellWidth = size.width / puzzle.columns;
    final cellHeight = size.height / puzzle.rows;
    canvas.drawRect(
      Offset.zero & size,
      Paint()..color = const Color(0xFFF8F5EA),
    );

    for (var row = 0; row < puzzle.rows; row++) {
      for (var col = 0; col < puzzle.columns; col++) {
        final point = GridPoint(row, col);
        final cell = puzzle.cellAt(point);
        if (cell.arrows.isEmpty || cleared.contains(point)) continue;

        final visualPoints = puzzle.paths[point];
        final points = visualPoints == null || visualPoints.length < 2
            ? <GridPoint>[point, point.move(cell.arrows.first)]
            : visualPoints;

        final isHint = hints.contains(point);
        final isWrong = wrongPoint == point;
        final isClearing = clearingPoint == point;
        final paint = Paint()
          ..style = PaintingStyle.stroke
          ..strokeWidth = min(cellWidth, cellHeight) * 0.14
          ..strokeCap = StrokeCap.round
          ..strokeJoin = StrokeJoin.round
          ..color = isHint
              ? Colors.amber.shade700
              : isWrong
                  ? Colors.redAccent
                  : const Color(0xFF102A43);

        if (isClearing) {
          paint.strokeWidth *= 1 - clearProgress * 0.55;
          paint.color = const Color(0xFF102A43).withValues(
            alpha: 1 - clearProgress,
          );
        }
        if (isWrong) {
          paint.strokeWidth *= 1 + sin(wrongProgress * pi) * 0.25;
        }

        final path = Path();
        final first = _center(points.first, cellWidth, cellHeight);
        path.moveTo(first.dx, first.dy);
        for (final pointOnPath in points.skip(1)) {
          final p = _center(pointOnPath, cellWidth, cellHeight);
          path.lineTo(p.dx, p.dy);
        }
        canvas.drawPath(path, paint);

        final from = _center(points[points.length - 2], cellWidth, cellHeight);
        final tip = _center(points.last, cellWidth, cellHeight);
        final delta = tip - from;
        final distance = delta.distance;
        if (distance == 0) continue;
        final direction = delta / distance;
        final perpendicular = Offset(-direction.dy, direction.dx);
        final headSize = min(cellWidth, cellHeight) * 0.32;
        final arrowPath = Path()
          ..moveTo(tip.dx, tip.dy)
          ..lineTo(
            tip.dx - direction.dx * headSize +
                perpendicular.dx * headSize * 0.58,
            tip.dy - direction.dy * headSize +
                perpendicular.dy * headSize * 0.58,
          )
          ..lineTo(
            tip.dx - direction.dx * headSize -
                perpendicular.dx * headSize * 0.58,
            tip.dy - direction.dy * headSize -
                perpendicular.dy * headSize * 0.58,
          )
          ..close();
        canvas.drawPath(
          arrowPath,
          Paint()
            ..style = PaintingStyle.fill
            ..color = paint.color,
        );
      }
    }
  }

  @override
  bool shouldRepaint(covariant _ArrowBoardPainter oldDelegate) =>
      oldDelegate.puzzle != puzzle ||
      oldDelegate.cleared != cleared ||
      oldDelegate.hints != hints ||
      oldDelegate.wrongPoint != wrongPoint ||
      oldDelegate.wrongProgress != wrongProgress ||
      oldDelegate.clearingPoint != clearingPoint ||
      oldDelegate.clearProgress != clearProgress;
}
'''
          path.write_text(text[:start] + replacement)
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/arrow_game_screen.dart
          git rm .github/workflows/apply-long-bent-arrows.yml
          git commit -m "Apply long bent arrow board"
          git push
