name: Apply Long Bent Arrows

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply long bent arrow board') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace board painter with long bent paths
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/screens/arrow_game_screen.dart')
          text = path.read_text()
          marker = 'class _ArrowBoardPainter extends CustomPainter {'
          start = text.index(marker)
          replacement = r'''class _ArrowBoardPainter extends CustomPainter {
  _ArrowBoardPainter({
    required this.puzzle,
    required this.cleared,
    required this.hints,
    required this.wrongPoint,
    required this.wrongProgress,
    required this.clearingPoint,
    required this.clearProgress,
  });

  final ArrowPuzzle puzzle;
  final Set<GridPoint> cleared;
  final Set<GridPoint> hints;
  final GridPoint? wrongPoint;
  final double wrongProgress;
  final GridPoint? clearingPoint;
  final double clearProgress;

  Offset _center(GridPoint p, double w, double h) => Offset(
        p.col * w + w / 2,
        p.row * h + h / 2,
      );

  @override
  void paint(Canvas canvas, Size size) {
    if (puzzle.rows <= 0 || puzzle.columns <= 0) return;
    final w = size.width / puzzle.columns;
    final h = size.height / puzzle.rows;
    canvas.drawRect(Offset.zero & size, Paint()..color = const Color(0xFFF8F5EA));

    for (var row = 0; row < puzzle.rows; row++) {
      for (var col = 0; col < puzzle.columns; col++) {
        final origin = GridPoint(row, col);
        final cell = puzzle.cellAt(origin);
        if (cell.arrows.isEmpty || cleared.contains(origin)) continue;

        final points = puzzle.paths[origin] ?? <GridPoint>[origin];
        if (points.isEmpty) continue;
        final isHint = hints.contains(origin);
        final isWrong = wrongPoint == origin;
        final isClearing = clearingPoint == origin;
        final paint = Paint()
          ..style = PaintingStyle.stroke
          ..strokeWidth = min(w, h) * 0.16
          ..strokeCap = StrokeCap.round
          ..strokeJoin = StrokeJoin.round
          ..color = isHint
              ? Colors.amber.shade700
              : isWrong
                  ? Colors.redAccent
                  : const Color(0xFF102A43);

        if (isWrong) paint.strokeWidth *= 1 + sin(wrongProgress * pi) * .25;
        if (isClearing) {
          paint.strokeWidth *= 1 - clearProgress * .55;
          paint.color = const Color(0xFF102A43).withValues(alpha: 1 - clearProgress);
        }

        final line = Path();
        final first = _center(points.first, w, h);
        line.moveTo(first.dx, first.dy);
        for (final p in points.skip(1)) {
          final q = _center(p, w, h);
          line.lineTo(q.dx, q.dy);
        }
        canvas.drawPath(line, paint);

        final tipPoint = points.last;
        final beforeTip = points.length > 1 ? points[points.length - 2] : origin;
        final tip = _center(tipPoint, w, h);
        final before = _center(beforeTip, w, h);
        final delta = tip - before;
        if (delta.distance == 0) continue;
        final unit = delta / delta.distance;
        final side = Offset(-unit.dy, unit.dx);
        final head = min(w, h) * .34;
        final arrow = Path()
          ..moveTo(tip.dx + unit.dx * head * .55, tip.dy + unit.dy * head * .55)
          ..lineTo(tip.dx - unit.dx * head + side.dx * head * .62, tip.dy - unit.dy * head + side.dy * head * .62)
          ..lineTo(tip.dx - unit.dx * head - side.dx * head * .62, tip.dy - unit.dy * head - side.dy * head * .62)
          ..close();
        canvas.drawPath(arrow, Paint()..style = PaintingStyle.fill..color = paint.color);
      }
    }
  }

  @override
  bool shouldRepaint(covariant _ArrowBoardPainter oldDelegate) => true;
}
'''
          path.write_text(text[:start] + replacement)
      - name: Commit screen and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/arrow_game_screen.dart
          git rm .github/workflows/apply-long-bent-arrows.yml
          git commit -m "Apply long bent arrow board"
          git push
